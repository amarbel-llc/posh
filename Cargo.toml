[workspace]
resolver = "2"
members = ["crates/posh-build", "crates/posh-term", "crates/posh-proto", "crates/posh", "crates/poshterity"]
# crates/posh path-deps vendor/galapagos/v2-rust (RFC 0007), which resolves
# inside this workspace root's directory tree — so without this exclude, Cargo
# implicitly treats it as a workspace member, pulling its lib+tests into
# `--workspace` builds/tests and its own source into our `-D warnings` clippy
# gate. galapagos is a separate repo (code.linenisgreat.com/galapagos)
# vendored read-only via a flake input; its lints are that repo's business,
# not ours.
exclude = ["vendor"]

[workspace.package]
# NOT the source of truth. The real version is version.env (POSH_VERSION),
# flowed into the crates at build time via each crate's build.rs
# (cargo:rustc-env=POSH_VERSION) and read at runtime as env!("POSH_VERSION").
# Cargo's package.version is mandatory, so this inert placeholder satisfies it
# for every workspace member (version.workspace = true); it is never bumped and
# nothing reads it for the actual version, so it cannot drift. See
# eng-versioning(7).
version = "0.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://code.linenisgreat.com/posh"

[profile.release]
lto = "thin"
strip = true
