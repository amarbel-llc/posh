[workspace]
resolver = "2"
members = ["crates/posh-build", "crates/posh-term", "crates/posh-proto", "crates/posh", "crates/poshterity"]
# crates/posh path-deps vendor/mephisto/v2-rust (RFC 0007), which resolves
# inside this workspace root's directory tree — so without this exclude, Cargo
# implicitly treats it as a workspace member, pulling its lib+tests into
# `--workspace` builds/tests and its own source into our `-D warnings` clippy
# gate. mephisto is a separate private repo (code.linenisgreat.com/mephisto)
# vendored read-only via a flake input; its lints are that repo's business,
# not ours.
exclude = ["vendor"]

[workspace.package]
# NOT the source of truth. The real version is version.env (POSH_VERSION),
# flowed into the crates at build time via each crate's build.rs
# (cargo:rustc-env=POSH_VERSION) and read at runtime as env!("POSH_VERSION").
# Cargo's package.version is mandatory, so this inert placeholder satisfies it
# for every workspace member (version.workspace = true); it is never bumped and
# nothing reads it for the actual version, so it cannot drift. See
# eng-versioning(7).
version = "0.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/amarbel-llc/mosh"

[profile.release]
lto = "thin"
strip = true

# rust-crap's canonical home is the eng forge (code.linenisgreat.com), served
# anonymously over https. mephisto's transitive dep points at the github mirror;
# redirect that source to the forge so posh's direct rust-crap dep and mephisto's
# transitive one unify to a single forge-sourced lock entry (no duplicate fetch
# or compile). Drop this once mephisto itself points at the forge.
[patch."https://github.com/amarbel-llc/crap.git"]
rust-crap = { git = "https://code.linenisgreat.com/crap.git", rev = "3d0b855e695b8642804e0795fe9d6333e85ac342" }
